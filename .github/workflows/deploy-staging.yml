name: Deploy Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check API status
        run: |
          curl -4 --fail-with-body --connect-timeout 10 --max-time 20 https://api.benjibusco.cloud/status

      - name: Trigger VPS deploy webhook
        run: |
          curl -4 --fail-with-body --connect-timeout 10 --max-time 60 -X POST https://api.benjibusco.cloud/deploy \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"target":"benkelly-staging"}'
